global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: filinglens-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: cadvisor                # every container: CPU, memory, liveness
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus              # Prometheus itself
    static_configs:
      - targets: ["localhost:9090"]
