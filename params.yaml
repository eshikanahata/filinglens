# Tracked by DVC: changing any listed value re-runs the dependent stage.
# The EDGAR User-Agent is NOT here; it comes from the EDGAR_USER_AGENT env var.
edgar:
  min_interval_seconds: 0.2   # 5 requests/sec, half of SEC's 10/sec limit
  timeout_seconds: 30

data:
  tickers_file: config/tickers.txt
  form_type: "10-K"
  # 3 fiscal years of modelling data + 1 prior year as the baseline for
  # year-over-year features, so the window starts one year earlier.
  start_date: "2021-01-01"
  end_date: null

parsing:
  num_workers: 4
  min_section_chars: 3000     # shorter "Item 1A" spans are treated as TOC hits

prices:
  benchmark: "SPY"
  start_date: "2020-12-01"
  end_date: "2026-10-14"      # fixed (not "today") so the stage is reproducible
  max_retries: 3

labels:
  horizon_trading_days: 30    # abnormal return window after the filing date

split:
  test_start_date: "2025-07-01"   # filings on/after this date form the test set
  embargo_days: 45                # train labels must end before the test period

features:
  lm_dictionary_path: data/external/LM_MasterDictionary.csv
  min_prior_gap_days: 300         # prior filing must be ~1 year earlier
  max_prior_gap_days: 450
  tfidf:
    max_features: 5000
    min_df: 3
    ngram_range: [1, 2]

train:
  random_state: 42
  cv_splits: 3
  logreg:
    C: 0.5
  xgboost:
    n_estimators: 150
    max_depth: 2
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "filinglens"
  registered_model_name: "filinglens-risk"

drift:
  psi_threshold: 0.2              # per-feature PSI at or above this = significant shift
  ks_alpha: 0.01                  # ... AND KS test p-value below this
  min_drifted_share: 0.25         # batch drifts when this share of features has drifted
  bins: 10
  min_current_samples: 20         # fewer new filings than this: report "insufficient_data"
  current_start_date: null        # null = use split.test_start_date

retrain:
  promotion_tolerance: 0.01       # promote unless new CV AUC is worse by more than this
