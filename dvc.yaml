stages:
  lint:
    cmd: >-
      flake8 api frontend src tests scripts --output-file=reports/lint_report.txt --tee
      && echo "flake8 passed with 0 warnings" >> reports/lint_report.txt
    deps:
      - api
      - frontend
      - src
      - tests
      - scripts
      - .flake8
    outs:
      - reports/lint_report.txt:
          cache: false

  test:
    cmd: pytest -q --junitxml=reports/pytest_results.xml && python scripts/summarize_tests.py
    deps:
      - api
      - frontend
      - src
      - tests
      - pytest.ini
      - reports/lint_report.txt
    outs:
      - reports/pytest_results.xml:
          cache: false
      - reports/test_summary.md:
          cache: false
    metrics:
      - reports/test_summary.json:
          cache: false


  download:
    cmd: python -m src.ingestion.download_filings
    deps:
      - src/ingestion/download_filings.py
      - src/ingestion/edgar_client.py
      - config/tickers.txt
    params:
      - data
      - edgar.min_interval_seconds
    outs:
      - data/raw
    metrics:
      - reports/download_metrics.json:
          cache: false

  parse:
    cmd: python -m src.parsing.parse_filings
    deps:
      - src/parsing
      - data/raw
    params:
      - parsing
    outs:
      - data/parsed
    metrics:
      - reports/parse_metrics.json:
          cache: false

  prices:
    cmd: python -m src.ingestion.download_prices
    deps:
      - src/ingestion/download_prices.py
      - config/tickers.txt
    params:
      - prices
    outs:
      - data/prices
    metrics:
      - reports/prices_metrics.json:
          cache: false

  labels:
    cmd: python -m src.labels.make_labels
    deps:
      - src/labels
      - src/common
      - data/parsed
      - data/prices
    params:
      - labels
    outs:
      - data/labels
    metrics:
      - reports/labels_metrics.json:
          cache: false

  features:
    cmd: python -m src.features.build_features
    deps:
      - src/features
      - src/common
      - data/parsed
      - data/external/LM_MasterDictionary.csv
    params:
      - features
      - split
    outs:
      - data/features
    metrics:
      - reports/features_metrics.json:
          cache: false

  train:
    cmd: python -m src.training.train
    deps:
      - src/training
      - src/features/columns.py
      - data/features
      - data/labels
    params:
      - train
      - split
      - labels
      - mlflow
    outs:
      - reports/train_run.json:
          cache: false
      - reports/model_comparison.csv:
          cache: false
    metrics:
      - reports/train_metrics.json:
          cache: false

  drift:
    cmd: python -m src.drift.check_drift
    deps:
      - src/drift
      - src/features/columns.py
      - src/common/run_log.py
      - data/features
    params:
      - drift
      - split
    outs:
      - reports/drift_report.json:
          cache: false
    metrics:
      - reports/drift_metrics.json:
          cache: false

  serving_data:
    cmd: python -m src.serving.build_serving_data
    deps:
      - src/serving/build_serving_data.py
      - src/common
      - src/features
      - data/features
      - data/parsed
    params:
      - features
    outs:
      - data/serving

  export_model:
    cmd: python -m src.serving.export_model
    deps:
      - src/serving/export_model.py
      - reports/train_run.json
      - reports/train_metrics.json
      - reports/test_summary.json      
    params:
      - mlflow
    outs:
      - models/champion
      - models/champion_info.json
